name: S21 Cross-browser Compatibility

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "qa/s21/**"
      - ".github/workflows/s21-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plus-cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright test runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - name: Install Firefox and WebKit
        working-directory: frontend
        run: npx playwright install --with-deps firefox webkit
      - name: Run Plus cross-browser compatibility
        working-directory: frontend
        run: npx playwright test --config=playwright.cross-browser.config.ts
      - name: Upload Plus cross-browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s21-plus-cross-browser-report
          path: |
            frontend/playwright-report-cross-browser/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  lite-cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Plus harness
        uses: actions/checkout@v4
      - name: Checkout certified Lite
        uses: actions/checkout@v4
        with:
          repository: c2melendez/precision-lab-lite
          ref: 9e75fc7447e62e09d6afe7a4b79d6a1b3302e843
          path: lite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lite/package-lock.json
      - name: Install Lite
        run: npm ci --prefix lite
      - name: Install Playwright test runner
        run: npm install --prefix lite --no-save --package-lock=false @playwright/test@1.63.0
      - name: Install Firefox and WebKit
        working-directory: lite
        run: npx playwright install --with-deps firefox webkit
      - name: Run Lite cross-browser compatibility
        working-directory: lite
        run: npx playwright test --config=playwright.cross-browser.config.ts
      - name: Upload Lite cross-browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s21-lite-cross-browser-report
          path: |
            lite/playwright-report-cross-browser/
            lite/test-results/
          if-no-files-found: ignore
          retention-days: 14
