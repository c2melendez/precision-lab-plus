name: CI

on:
  push:
    branches: [main, master, qa/exhaustive-suite-module-01]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Backend tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=75 --disable-warnings

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: QA dependency audit
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and parity tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload production build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plus-frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
          retention-days: 7
