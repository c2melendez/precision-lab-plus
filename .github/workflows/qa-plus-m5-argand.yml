name: QA Plus M5 Argand Gate

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-plus-m5-argand.yml
      - frontend/e2e/exhaustive-module05-complex.spec.ts
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  m5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/exhaustive-suite-module-01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: M5 E2E
        id: e2e
        continue-on-error: true
        working-directory: frontend
        shell: bash
        run: npx playwright test e2e/exhaustive-module05-complex.spec.ts --reporter=line 2>&1 | tee ../m5-argand.log
      - name: Persist diagnostic
        if: always()
        env:
          E2E: ${{ steps.e2e.outcome }}
        shell: bash
        run: |
          mkdir -p .qa-results
          {
            echo "# QA Plus — M5 Argand gate"
            echo
            echo "- SHA: `$GITHUB_SHA`"
            echo "- E2E: **$E2E**"
            echo
            echo '~~~text'
            tail -n 500 m5-argand.log
            echo '~~~'
          } > .qa-results/plus-m5-argand.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa-results/plus-m5-argand.md
          git diff --cached --quiet || git commit -m "QA M5 Argand diagnostic [skip ci]"
          git push origin HEAD:qa/exhaustive-suite-module-01
