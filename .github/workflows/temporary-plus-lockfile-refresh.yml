name: Temporary Plus frontend lockfile refresh

on:
  push:
    branches:
      - feature/m2-command-runner-bridge
    paths:
      - .github/workflows/temporary-plus-lockfile-refresh.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate lockfile without running project lifecycle scripts
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: plus-frontend-lockfile-regenerated
          path: frontend/package-lock.json
          retention-days: 1
