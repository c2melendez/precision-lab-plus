name: Temporary Plus frontend lockfile refresh

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/temporary-plus-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/m2-command-runner-bridge
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate the lockfile using the existing manifest and security overrides
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation
        working-directory: frontend
        run: npm ci
      - name: Verify TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Verify frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Verify production build
        working-directory: frontend
        run: npm run build
      - name: Upload regenerated lockfile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plus-frontend-lockfile-regenerated
          path: frontend/package-lock.json
          retention-days: 1
      - name: Commit the validated lockfile only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the manifest."
            exit 0
          fi
          git commit -m "fix(deps): synchronize Plus frontend lockfile"
          git push origin HEAD:refs/heads/feature/m2-command-runner-bridge
