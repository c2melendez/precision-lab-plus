name: S25 Security Gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/s25-security.yml"
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/s25-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit report
        run: npm audit --json > npm-audit.json || true
      - name: Block high/critical npm vulnerabilities
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s25-plus-npm-audit
          path: frontend/npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CORS_ORIGINS: https://security-test.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-qa.txt
      - run: pip install -r requirements.txt -r requirements-qa.txt pip-audit bandit
      - name: pip-audit runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Bandit medium/high gate
        run: bandit -r app -ll -ii
      - name: Security and CORS regressions
        run: pytest -q tests/test_exhaustive_module13_security.py tests/test_s25_deployment_security.py
