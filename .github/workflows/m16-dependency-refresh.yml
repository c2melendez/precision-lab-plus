name: M16 dependency refresh

on:
  push:
    branches: [qa/post-track-d-m16]

permissions:
  contents: write

concurrency:
  group: m16-dependency-refresh-plus
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/post-track-d-m16
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh controlled tooling dependencies
        run: npm install --save-dev vite@8.3.0 vitest@5.0.1 @vitejs/plugin-react@6.1.1 vite-plugin-pwa@1.3.0 openapi-typescript@7.13.0
      - name: Commit package metadata when changed
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "No package metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "M16 Plus: actualizar tooling y OpenAPI"
          git push origin HEAD:qa/post-track-d-m16
