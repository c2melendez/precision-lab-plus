name: M16 dependency refresh

on:
  push:
    branches: [qa/m16-post-trackd-stabilization]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/m16-post-trackd-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Reproducible install
        run: npm ci
      - name: Runtime audit
        run: npm audit --omit=dev --json > m16-audit-runtime.json || true
      - name: Full audit
        run: npm audit --json > m16-audit-full.json || true
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit refreshed lockfile
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "frontend/package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "M16: regenerar lockfile con tooling actualizado"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-plus-audit
          path: |
            frontend/m16-audit-runtime.json
            frontend/m16-audit-full.json
          if-no-files-found: ignore
