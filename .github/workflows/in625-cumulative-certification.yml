name: IN625 Cumulative Certification Gate

on:
  push:
    branches: [qa/syntax-audit-in625-a1]
    paths-ignore:
      - 'qa/certification/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CORS_ORIGINS: https://security-test.example
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-qa.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-qa.txt pytest-cov pytest-timeout
      - name: Backend regression
        run: pytest -vv -ra --durations=15 --timeout=60 --timeout-method=signal --cov=app --cov-report=term-missing --cov-fail-under=75 --disable-warnings

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and parity regression
        run: npm test
      - name: Production build
        run: npm run build
