name: Restore matrix_service MV-F
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-matrix-service-mvf.yml
    branches:
      - qa/syntax-audit-in625-a1

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/syntax-audit-in625-a1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore from known-good commit and raise power limit
        run: |
          git show 1ad124fe174b0cef6f220f69578dace1c478c483:backend/app/services/matrix_service.py \
            > backend/app/services/matrix_service.py
          sed -i 's/MAX_MATRIX_POWER_EXPONENT = 10/MAX_MATRIX_POWER_EXPONENT = 32/' backend/app/services/matrix_service.py
          grep -q 'MAX_MATRIX_POWER_EXPONENT = 32' backend/app/services/matrix_service.py
          grep -q 'def determinant' backend/app/services/matrix_service.py
          wc -c backend/app/services/matrix_service.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/matrix_service.py
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "fix(matrices): restore matrix_service.py MAX_MATRIX_POWER_EXPONENT=32"
          git push origin HEAD:qa/syntax-audit-in625-a1
