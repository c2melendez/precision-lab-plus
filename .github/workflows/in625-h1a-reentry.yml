name: IN625 H1a Reentry Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h1a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run IN625 H1a reentry
        run: npx playwright test e2e/in625-h1a-reentry.spec.ts --project desktop-chromium
