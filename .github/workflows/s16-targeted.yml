name: S16 targeted regressions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  s16:
    if: github.head_ref == 'qa/s16-official-browser-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright test runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run S16 REG-001..REG-010
        working-directory: frontend
        run: npx playwright test e2e/s16-critical-regressions.spec.ts --project=desktop-chromium
