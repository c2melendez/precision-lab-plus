name: IN625 A1+A2+A3+A4 Syntax Diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run A1+A2+A3+A4 syntax diagnostics
        run: npx vitest run src/__tests__/in625A1Fractions.audit.test.ts src/__tests__/in625A2Delimiters.audit.test.ts src/__tests__/in625A3Operators.audit.test.ts src/__tests__/in625A4Roots.audit.test.ts
