name: IN625 A1+A2+A3+A4+B1+B2+B3+B4+C1+C2+C3+C4+D1+D2+D3+E1a+E1b+E1c+E1d+E2a+E2b+E2c+E3a+E3b+E3c+E3d1+E3d2+E3d3+F1+F2a+F2b+F3a+F3b Syntax Diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# E3b backend oracle rerun
jobs:
  a2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Plus backend dependencies for D3
        run: python -m pip install -r ../backend/requirements.txt
      - name: Run A1+A2+A3+A4+B1+B2+B3+B4+C1+C2+C3+C4+D1+D2+D3+E1a+E1b+E1c+E1d+E2a+E2b+E2c+E3a+E3b+E3c+E3d1+E3d2+E3d3+F1+F2a+F2b+F3a+F3b syntax diagnostics
        run: npx vitest run src/__tests__/in625A1Fractions.audit.test.ts src/__tests__/in625A2Delimiters.audit.test.ts src/__tests__/in625A3Operators.audit.test.ts src/__tests__/in625A4Roots.audit.test.ts src/__tests__/in625B1Exponents.audit.test.ts src/__tests__/in625B2SubscriptsLogs.audit.test.ts src/__tests__/in625B3ImplicitMultiplication.audit.test.ts src/__tests__/in625B4Precedence.audit.test.ts src/__tests__/in625C1FunctionPowers.audit.test.ts src/__tests__/in625C2FunctionArguments.audit.test.ts src/__tests__/in625C3SpanishAliases.audit.test.ts src/__tests__/in625C4ConstantsFunctions.audit.test.ts src/__tests__/in625D1Decimals.audit.test.ts src/__tests__/in625D2ScientificPercent.audit.test.ts src/__tests__/in625D3Precision.audit.test.ts src/__tests__/in625E1aDerivatives.audit.test.ts src/__tests__/in625E1bLimits.audit.test.ts src/__tests__/in625E1cIntegrals.audit.test.ts src/__tests__/in625E1dAggregates.audit.test.ts src/__tests__/in625E2aMatrices.audit.test.ts src/__tests__/in625E2bSystems.audit.test.ts src/__tests__/in625E2cPiecewise.audit.test.ts src/__tests__/in625E3aIntent.audit.test.ts src/__tests__/in625E3bFreeSystems.audit.test.ts src/__tests__/in625E3cODE.audit.test.ts src/__tests__/in625E3d1Relations.audit.test.ts src/__tests__/in625E3d2Identities.audit.test.ts src/__tests__/in625E3d3Constrained.audit.test.ts src/__tests__/in625F1PastedLatex.audit.test.ts src/__tests__/in625F2aUnicode.audit.test.ts src/__tests__/in625F2bUnicode.audit.test.ts src/__tests__/in625F3aExternalSyntax.audit.test.ts src/__tests__/in625F3bExternalSyntax.audit.test.ts
      - name: Run D3 exact backend precision diagnostics
        run: PYTHONPATH=../backend pytest -q ../backend/tests/test_in625_d3_precision.py ../backend/tests/test_in625_e1a_derivatives.py ../backend/tests/test_in625_e1b_limits.py ../backend/tests/test_in625_e1c_integrals.py ../backend/tests/test_in625_e1d_aggregates.py ../backend/tests/test_in625_e2a_matrices.py ../backend/tests/test_in625_e2b_systems.py ../backend/tests/test_in625_e2c_piecewise.py ../backend/tests/test_in625_e3a_intent.py ../backend/tests/test_in625_e3b_free_systems.py ../backend/tests/test_in625_e3c_ode.py ../backend/tests/test_in625_e3d1_relations.py ../backend/tests/test_in625_e3d2_identities.py ../backend/tests/test_in625_e3d3_constrained.py
