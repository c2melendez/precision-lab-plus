name: QA Full E2E Reporter

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-full-e2e-reporter.yml
      - .github/workflows/playwright.yml
      - frontend/e2e/**
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/exhaustive-suite-module-01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Full Playwright regression
        id: e2e
        continue-on-error: true
        working-directory: frontend
        shell: bash
        run: npx playwright test --reporter=line 2>&1 | tee ../full-e2e.log
      - name: Publish result to PR 4
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          E2E: ${{ steps.e2e.outcome }}
        shell: bash
        run: |
          {
            echo "<!-- qa-plus-full-e2e -->"
            echo "## QA Plus — regresión Playwright completa"
            echo
            echo "- SHA: `$GITHUB_SHA`"
            echo "- resultado: **$E2E**"
            echo
            echo "### Resumen"
            echo '~~~text'
            grep -E "([0-9]+ passed|[0-9]+ failed|[0-9]+ flaky|Running [0-9]+ tests|› e2e/)" full-e2e.log | tail -n 180 || true
            echo '~~~'
          } > /tmp/qa-comment.md
          gh pr comment 4 --repo c2melendez/precision-lab-plus --body-file /tmp/qa-comment.md
