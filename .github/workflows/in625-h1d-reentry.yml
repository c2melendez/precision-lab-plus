name: IN625 H1d Reentry Diagnostic

on:
  push:
    branches:
      - qa/syntax-audit-in625-a1
    paths:
      - '**'
      - '!**/*.md'
      - '!qa/certification/continuity.json'
      - 'qa/certification/EXECUTION_PROTOCOL.md'
      - 'qa/certification/SG28_DISTRIBUTED_ACCEPTANCE.md'
      - 'qa/certification/SY_P_23_CONVENTION.md'
      - 'qa/certification/SY_X_04_LENGTH_CONTRACT.md'
      - 'qa/certification/SY_X_04_LENGTH_DECISION.md'
      - 'qa/certification/SG28_INTEGRATION_EXIT_CRITERIA.md'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!qa/certification/continuity.json'
      - 'qa/certification/EXECUTION_PROTOCOL.md'
      - 'qa/certification/SG28_DISTRIBUTED_ACCEPTANCE.md'
      - 'qa/certification/SY_P_23_CONVENTION.md'
      - 'qa/certification/SY_X_04_LENGTH_CONTRACT.md'
      - 'qa/certification/SY_X_04_LENGTH_DECISION.md'
      - 'qa/certification/SG28_INTEGRATION_EXIT_CRITERIA.md'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for revalidating this SHA (recorded in the guard log)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  h1d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Reuse only verified evidence for this checkout
        id: certification_guard
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVALIDATION_REASON: ${{ inputs.reason }}
        run: python3 scripts/certification/ci_guard.py --profile h1d
      - uses: actions/setup-python@v5
        if: steps.certification_guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        if: steps.certification_guard.outputs.skip != 'true'
        working-directory: backend
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v7
        if: steps.certification_guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: steps.certification_guard.outputs.skip != 'true'
        working-directory: frontend
        run: npm ci
      - name: Install Playwright test runner
        if: steps.certification_guard.outputs.skip != 'true'
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0
      - name: Install Chromium
        if: steps.certification_guard.outputs.skip != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run IN625 H1d reentry
        if: steps.certification_guard.outputs.skip != 'true'
        working-directory: frontend
        run: npx playwright test e2e/in625-h1d-reentry.spec.ts --project desktop-chromium
