name: QA Fast CI Diagnostic

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/exhaustive-suite-module-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run CI diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .qa-results
          (cd frontend && npm ci) > npm-ci.log 2>&1
          A=$?
          (cd frontend && npm run typecheck) > typecheck.log 2>&1
          B=$?
          (cd frontend && npm test) > unit.log 2>&1
          C=$?
          (cd frontend && npm run build) > build.log 2>&1
          D=$?
          {
            echo "# QA fast CI diagnostic — Plus"
            echo
            echo "- npm_ci: $A"
            echo "- typecheck: $B"
            echo "- unit: $C"
            echo "- build: $D"
            for f in npm-ci typecheck unit build; do
              echo
              echo "## $f"
              echo '~~~text'
              tail -n 260 "$f.log" 2>/dev/null || true
              echo '~~~'
            done
          } > .qa-results/diagnostics-latest.md
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa-results/diagnostics-latest.md
          git diff --cached --quiet && exit 0
          git commit -m "QA fast diagnostics [skip ci]"
          git push origin HEAD:qa/exhaustive-suite-module-01

