name: QA Fast E2E Diagnostic

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/exhaustive-suite-module-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run directed E2E
        shell: bash
        run: |
          set +e
          mkdir -p .qa-results
          cd frontend
          npx playwright test e2e/exhaustive-module03-calculus.spec.ts e2e/exhaustive-module09-graphing.spec.ts e2e/exhaustive-module10-keyboard.spec.ts e2e/exhaustive-module12-personalization-a11y.spec.ts --reporter=line > ../e2e-directed.log 2>&1
          CODE=$?
          cd ..
          {
            echo "# QA directed E2E diagnostic — Plus"
            echo
            echo "- exit_code: $CODE"
            echo
            echo '~~~text'
            tail -n 500 e2e-directed.log
            echo '~~~'
          } > .qa-results/e2e-directed-latest.md
          exit 0
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa-results/e2e-directed-latest.md
          git diff --cached --quiet && exit 0
          git commit -m "QA E2E diagnostics [skip ci]"
          git push origin HEAD:qa/exhaustive-suite-module-01
