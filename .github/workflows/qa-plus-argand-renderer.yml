name: QA Plus Argand Renderer Gate

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-plus-argand-renderer.yml
      - frontend/src/__tests__/GraphViewer.test.tsx
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/exhaustive-suite-module-01
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: GraphViewer unit test
        id: unit
        continue-on-error: true
        working-directory: frontend
        shell: bash
        run: npx vitest run src/__tests__/GraphViewer.test.tsx --reporter=verbose 2>&1 | tee ../argand-renderer.log
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.unit.outcome }}
        shell: bash
        run: |
          {
            echo "<!-- qa-plus-argand-renderer -->"
            echo "## QA Plus — Argand renderer gate"
            echo
            echo "- SHA: `$GITHUB_SHA`"
            echo "- unit: **$OUTCOME**"
            echo
            echo '~~~text'
            tail -n 180 argand-renderer.log
            echo '~~~'
          } > /tmp/renderer.md
          gh pr comment 4 --repo c2melendez/precision-lab-plus --body-file /tmp/renderer.md
