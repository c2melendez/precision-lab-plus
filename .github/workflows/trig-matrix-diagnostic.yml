name: Trig Matrix Diagnostic

on:
  push:
    branches: [qa/s26-execution]
    paths:
      - "frontend/e2e/trig-matrix-diagnostic.spec.ts"
      - ".github/workflows/trig-matrix-diagnostic.yml"
  workflow_dispatch:

jobs:
  trig-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright test runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run trig matrix only
        working-directory: frontend
        run: npx playwright test e2e/trig-matrix-diagnostic.spec.ts --project=desktop-chromium --workers=4
