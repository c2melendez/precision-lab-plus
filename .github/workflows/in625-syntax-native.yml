name: IN625 Plus Native Syntax and Recovery

on:
  push:
    branches: [qa/syntax-audit-in625-a1]
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/in625-syntax-native.spec.ts'
      - 'frontend/e2e/scriptInertProbe.ts'
      - 'frontend/e2e/fileAccessProbe.ts'
      - 'frontend/package*.json'
      - 'frontend/playwright.config.ts'
      - 'backend/app/**'
      - 'backend/requirements*.txt'
      - 'qa/certification/syntax309_cases.jsonl'
      - 'scripts/certification/**'
      - '.github/workflows/in625-syntax-native.yml'
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/in625-syntax-native.spec.ts'
      - 'frontend/e2e/scriptInertProbe.ts'
      - 'frontend/e2e/fileAccessProbe.ts'
      - 'frontend/package*.json'
      - 'frontend/playwright.config.ts'
      - 'backend/app/**'
      - 'backend/requirements*.txt'
      - 'qa/certification/syntax309_cases.jsonl'
      - 'scripts/certification/**'
      - '.github/workflows/in625-syntax-native.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for revalidating this checkout
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  syntax-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SG28_EVALUATE_ISOLATION: '0'
      SG28_CI_SLOW: '0'
      SG28_CI_OBSERVE: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Reuse only verified evidence for this checkout
        id: certification_guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVALIDATION_REASON: ${{ inputs.reason }}
        run: python3 scripts/certification/ci_guard.py --profile plus-native
      - uses: actions/setup-python@v5
        if: steps.certification_guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install real backend dependencies
        if: steps.certification_guard.outputs.skip != 'true'
        run: pip install -r backend/requirements.txt -r backend/requirements-qa.txt
      - uses: actions/setup-node@v4
        if: steps.certification_guard.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native frontend and browser
        if: steps.certification_guard.outputs.skip != 'true'
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0
          npx playwright install --with-deps chromium
      - name: Native desktop syntax and HTTP recovery
        if: steps.certification_guard.outputs.skip != 'true'
        working-directory: frontend
        run: npx playwright test e2e/in625-syntax-native.spec.ts --project desktop-chromium --workers=1 --retries=0
      - name: Native tablet and mobile syntax and HTTP recovery
        if: success() && steps.certification_guard.outputs.skip != 'true'
        working-directory: frontend
        run: npx playwright test e2e/in625-syntax-native.spec.ts --project tablet-chromium --project mobile-chromium --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always() && steps.certification_guard.outputs.skip != 'true'
        with:
          name: plus-native-syntax-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 14
